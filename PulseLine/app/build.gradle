plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pulseline.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.pulseline.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party libraries: the app uses only the Android framework.
